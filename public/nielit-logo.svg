<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <!-- Globe Gradient -->
    <radialGradient id="nielitGlobeGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
    
    <!-- Shading for Figure Arches -->
    <linearGradient id="nielitBluePerson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="nielitPinkPerson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d91460" />
    </linearGradient>

    <linearGradient id="nielitGreenWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- NIELIT EMBLEM ICON (Left Group: Center at x=85, y=90) -->
  <g id="nielit-official-symbol" transform="translate(10, 5)">
    <!-- 3 Green Signal Wave Arcs (Top-Left) -->
    <path d="M 52,58 A 54,54 0 0,1 86,24" fill="none" stroke="url(#nielitGreenWave)" stroke-width="5" stroke-linecap="round" />
    <path d="M 42,48 A 68,68 0 0,1 88,10" fill="none" stroke="url(#nielitGreenWave)" stroke-width="5" stroke-linecap="round" />
    <path d="M 32,38 A 82,82 0 0,1 90,-4" fill="none" stroke="url(#nielitGreenWave)" stroke-width="5" stroke-linecap="round" />

    <!-- Top Blue Figure (Head + Swirling Body) -->
    <circle cx="112" cy="28" r="10.5" fill="url(#nielitBluePerson)" />
    <path d="M 88,44 C 102,32 128,34 142,54 C 134,70 126,84 116,92 C 106,78 96,58 88,44 Z" fill="url(#nielitBluePerson)" />

    <!-- Left Magenta/Pink Figure (Head + Swirling Body) -->
    <circle cx="44" cy="72" r="10.5" fill="url(#nielitPinkPerson)" />
    <path d="M 42,86 C 48,104 56,122 66,134 C 60,122 54,106 50,90 Z" fill="url(#nielitPinkPerson)" />
    <path d="M 42,82 C 58,56 88,46 112,48 C 94,52 74,62 58,82 Z" fill="#84cc16" />
    <path d="M 42,82 C 50,72 68,58 88,52 C 64,66 52,90 48,112 C 43,100 41,90 42,82 Z" fill="url(#nielitPinkPerson)" />

    <!-- Central Globe Circle -->
    <circle cx="104" cy="98" r="44" fill="url(#nielitGlobeGrad)" />

    <!-- Globe Grid Lines (Latitudes & Longitudes) -->
    <path d="M 104,54 C 78,70 78,126 104,142" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M 104,54 C 130,70 130,126 104,142" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M 64,80 C 82,102 122,118 144,110" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M 68,118 C 92,104 128,76 136,70" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M 60,98 C 80,92 124,92 148,98" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- NIELIT OFFICIAL BILINGUAL TYPOGRAPHY -->
  <g id="nielit-typography" transform="translate(180, 0)">
    <!-- Hindi Name: रा.इ.सू.प्रौ.सं / राष्ट्रीय इलेक्ट्रॉनिकी एवं सूचना प्रौद्योगिकी संस्थान -->
    <text x="0" y="44" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#003366" letter-spacing="1">रा.इ.सू.प्रौ.सं</text>
    <text x="145" y="44" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0369a1" letter-spacing="0.5">राष्ट्रीय इलेक्ट्रॉनिकी एवं सूचना प्रौद्योगिकी संस्थान</text>

    <!-- Main Bold Brand: NIELIT -->
    <text x="0" y="112" font-family="'Arial Black', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="74" font-weight="900" fill="#003366" letter-spacing="2">NIELIT</text>

    <!-- English Official Subtitle -->
    <text x="2" y="142" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#475569" letter-spacing="0.2">National Institute of Electronics &amp; Information Technology</text>
    <text x="2" y="162" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.3">Ministry of Electronics and Information Technology (MeitY), Govt. of India</text>
  </g>
</svg>
