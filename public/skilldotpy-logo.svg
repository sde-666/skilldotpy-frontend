<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="skShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#skBgGrad)" stroke="#E2E8F0" stroke-width="6" />

  <!-- Logo Main Group -->
  <g transform="translate(0, 30)">
    <!-- "Skill" Text -->
    <text x="64" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="114" font-weight="900" fill="#0B132B" letter-spacing="-2">Skill</text>
    
    <!-- Dot "." -->
    <circle cx="304" cy="230" r="15" fill="#6C82E8" />
    
    <!-- "py" Text in Coral Pink -->
    <text x="326" y="240" font-family="'Courier New', 'Roboto Slab', Rockwell, Georgia, serif" font-size="124" font-weight="900" fill="#F45B69" letter-spacing="1">py</text>
    
    <!-- Tagline: "Just learn skills..." -->
    <text x="256" y="320" text-anchor="middle" font-family="'Caveat', 'Comic Sans MS', 'Segoe Print', 'Brush Script MT', cursive, sans-serif" font-size="42" font-weight="700" fill="#111827" letter-spacing="0.5">Just learn skills...</text>
  </g>
</svg>
