<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="100%" height="100%">
  <defs>
    <!-- Globe Gradient -->
    <radialGradient id="nielitGlobeGradEmblem" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
    
    <!-- Shading for Figure Arches -->
    <linearGradient id="nielitBluePersonEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="nielitPinkPersonEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d91460" />
    </linearGradient>

    <linearGradient id="nielitGreenWaveEmblem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- NIELIT EMBLEM ICON (Center at x=85, y=85) -->
  <g id="nielit-emblem-pure" transform="translate(0, 0)">
    <!-- 3 Green Signal Wave Arcs (Top-Left) -->
    <path d="M 46,54 A 54,54 0 0,1 80,20" fill="none" stroke="url(#nielitGreenWaveEmblem)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 36,44 A 68,68 0 0,1 82,6" fill="none" stroke="url(#nielitGreenWaveEmblem)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 26,34 A 82,82 0 0,1 84,-8" fill="none" stroke="url(#nielitGreenWaveEmblem)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Top Blue Figure (Head + Swirling Body) -->
    <circle cx="106" cy="24" r="11" fill="url(#nielitBluePersonEmblem)" />
    <path d="M 82,40 C 96,28 122,30 136,50 C 128,66 120,80 110,88 C 100,74 90,54 82,40 Z" fill="url(#nielitBluePersonEmblem)" />

    <!-- Left Magenta/Pink Figure (Head + Swirling Body) -->
    <circle cx="38" cy="68" r="11" fill="url(#nielitPinkPersonEmblem)" />
    <path d="M 36,82 C 42,100 50,118 60,130 C 54,118 48,102 44,86 Z" fill="url(#nielitPinkPersonEmblem)" />
    <path d="M 36,78 C 52,52 82,42 106,44 C 88,48 68,58 52,78 Z" fill="#84cc16" />
    <path d="M 36,78 C 44,68 62,54 82,48 C 58,62 46,86 42,108 C 37,96 35,86 36,78 Z" fill="url(#nielitPinkPersonEmblem)" />

    <!-- Central Globe Circle -->
    <circle cx="98" cy="94" r="46" fill="url(#nielitGlobeGradEmblem)" />

    <!-- Globe Grid Lines (Latitudes & Longitudes) -->
    <path d="M 98,48 C 72,64 72,124 98,140" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />
    <path d="M 98,48 C 124,64 124,124 98,140" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />
    <path d="M 58,74 C 76,96 116,114 138,106" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />
    <path d="M 62,114 C 86,100 122,72 130,66" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />
    <path d="M 54,94 C 74,88 118,88 142,94" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
